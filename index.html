<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

.mw-root {
  --ink: #1c1c1c;
  --paper: #fafaf8;
  --red: #b5342e;
  --blue: #2c4a6e;
  --amber: #c97a2e;
  --line: #e2ddd3;
  font-family: 'Roboto', -apple-system, sans-serif;
  color: var(--ink);
  background: var(--paper);
  min-height: 100%;
  padding: 20px 16px 60px;
  max-width: 560px;
  margin: 0 auto;
  box-sizing: border-box;
}
.mw-root * { box-sizing: border-box; }

.mw-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 3px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 4px;
}
.mw-title {
  font-family: 'Roboto Condensed', sans-serif;
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.5px;
  color: var(--red);
  text-transform: uppercase;
}
.mw-sub {
  font-size: 12px;
  color: var(--blue);
  font-weight: 500;
  letter-spacing: 0.5px;
}
.mw-stats {
  display: flex;
  gap: 18px;
  margin: 14px 0 20px;
  font-family: 'Roboto Condensed', sans-serif;
}
.mw-stat-num { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1; }
.mw-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--blue); }

.mw-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px;
  margin-bottom: 22px;
}
.mw-form input {
  font-family: 'Roboto', sans-serif;
  font-size: 14px;
  padding: 10px 10px;
  border: 1px solid var(--line);
  border-radius: 3px;
  outline: none;
  width: 100%;
}
.mw-form input:focus { border-color: var(--blue); }
.mw-form input[name="name"] { grid-column: 1 / -1; }
.mw-add-btn {
  grid-column: 1 / -1;
  background: var(--red);
  color: white;
  border: none;
  border-radius: 3px;
  padding: 12px;
  font-family: 'Roboto Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
}
.mw-add-btn:active { opacity: 0.85; }
.mw-add-btn:disabled { background: #ccc; cursor: not-allowed; }

.mw-list { display: flex; flex-direction: column; gap: 12px; }

.mw-empty {
  text-align: center;
  padding: 40px 20px;
  color: #999;
  font-size: 13px;
  border: 1px dashed var(--line);
  border-radius: 4px;
}

.mw-ticket {
  position: relative;
  background: white;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 14px 16px 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  overflow: hidden;
}
.mw-ticket::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: var(--blue);
}
.mw-ticket.mw-notified::before { background: var(--amber); }
.mw-ticket.mw-overdue::before { background: var(--red); }

.mw-ticket-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mw-ticket-name {
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mw-ticket-meta {
  font-size: 12px;
  color: #666;
  display: flex;
  gap: 8px;
}
.mw-badge-party {
  color: var(--blue);
  font-weight: 500;
}

.mw-ticket-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.mw-wait {
  font-family: 'Roboto Condensed', sans-serif;
  text-align: center;
}
.mw-wait-num { font-size: 20px; font-weight: 700; line-height: 1; }
.mw-wait-label { font-size: 9px; text-transform: uppercase; color: #999; letter-spacing: 0.5px; }
.mw-wait.mw-overdue-text .mw-wait-num { color: var(--red); }

.mw-actions { display: flex; gap: 6px; }
.mw-btn {
  border: none;
  border-radius: 3px;
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Roboto Condensed', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  cursor: pointer;
  white-space: nowrap;
}
.mw-btn-notify { background: var(--amber); color: white; }
.mw-btn-seat { background: var(--ink); color: white; }
.mw-btn-remove { background: transparent; color: #999; padding: 8px 6px; font-size: 16px; }
.mw-btn:active { opacity: 0.8; }

.mw-notified-tag {
  position: absolute;
  top: 6px;
  right: 10px;
  font-size: 9px;
  color: var(--amber);
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.mw-loading { text-align: center; padding: 40px; color: #999; font-size: 13px; }

.mw-note {
  font-size: 12px;
  color: var(--amber);
  margin-top: 3px;
  font-style: italic;
}

/* Client view */
.mw-client-wrap {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.mw-client-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 28px 22px;
}
.mw-client-logo {
  font-family: 'Roboto Condensed', sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: var(--red);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 2px;
}
.mw-client-sub {
  text-align: center;
  font-size: 12px;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin-bottom: 22px;
}
.mw-client-field { margin-bottom: 14px; }
.mw-client-field label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #888;
  margin-bottom: 5px;
  font-weight: 500;
}
.mw-client-field input, .mw-client-field textarea {
  width: 100%;
  font-family: 'Roboto', sans-serif;
  font-size: 15px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  outline: none;
  resize: none;
}
.mw-client-field input:focus, .mw-client-field textarea:focus { border-color: var(--blue); }
.mw-phone-group {
  display: flex;
  align-items: stretch;
  gap: 0;
}
.mw-phone-prefix {
  display: flex;
  align-items: center;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-right: none;
  border-radius: 4px 0 0 4px;
  background: #f2f0eb;
  font-size: 15px;
  font-weight: 500;
  color: #555;
  white-space: nowrap;
}
.mw-phone-group input {
  border-radius: 0 4px 4px 0 !important;
}
.mw-client-submit {
  width: 100%;
  background: var(--red);
  color: white;
  border: none;
  border-radius: 4px;
  padding: 15px;
  font-family: 'Roboto Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  margin-top: 6px;
}
.mw-client-submit:active { opacity: 0.85; }

.mw-confirm {
  text-align: center;
  padding: 10px 6px;
}
.mw-confirm-check {
  font-size: 40px;
  color: var(--amber);
  margin-bottom: 6px;
}
.mw-confirm-pos {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 46px;
  font-weight: 700;
  color: var(--red);
  line-height: 1;
  margin: 6px 0 2px;
}
.mw-confirm-pos-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #888;
  margin-bottom: 18px;
}
.mw-version-tag {
  position: fixed;
  bottom: 6px;
  right: 8px;
  font-size: 10px;
  color: #ccc;
  font-family: monospace;
}
.mw-confirm-msg {
  font-size: 14px;
  color: #444;
  line-height: 1.5;
}
</style>

<div id="mw-app" class="mw-root">
  <div class="mw-loading">Cargando lista...</div>
</div>

<script>
(function () {
  const STORAGE_KEY = "waitlist:franklin";
  const APP_VERSION = "v3 · 9-ago";
  const params = new URLSearchParams(window.location.search);
  const isClientView = params.get("view") === "client";
  let guests = [];
  let loaded = false;

  function fmtElapsed(ms) {
    const mins = Math.floor(ms / 60000);
    if (mins < 1) return "0";
    return String(mins);
  }

  function cleanPhone(raw) {
    return raw.replace(/[^\d+]/g, "");
  }

  function waLink(phone, name) {
    const digits = cleanPhone(phone).replace(/^\+/, "");
    const msg = encodeURIComponent(
      `Hola ${name} 👋 Habla Mirai Franklin — tu mesa ya está lista. Te esperamos en la entrada.`
    );
    return `https://wa.me/${digits}?text=${msg}`;
  }

  async function loadGuests() {
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      guests = res && res.value ? JSON.parse(res.value) : [];
    } catch (e) {
      guests = [];
    }
    loaded = true;
    render();
  }

  async function saveGuests() {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(guests), true);
    } catch (e) {
      console.error("No se pudo guardar", e);
    }
  }

  function addGuest(name, phone, party, note) {
    const guest = {
      id: "g" + Date.now() + Math.random().toString(36).slice(2, 7),
      name: name.trim(),
      phone: phone.trim(),
      party: party || "1",
      note: (note || "").trim(),
      arrivedAt: Date.now(),
      status: "waiting", // waiting | notified | seated
    };
    guests.push(guest);
    saveGuests();
    return guest;
  }

  function markNotified(id) {
    const g = guests.find((x) => x.id === id);
    if (!g) return;
    g.status = "notified";
    g.notifiedAt = Date.now();
    saveGuests();
    render();
    window.open(waLink(g.phone, g.name), "_blank");
  }

  function markSeated(id) {
    guests = guests.filter((x) => x.id !== id);
    saveGuests();
    render();
  }

  function removeGuest(id) {
    guests = guests.filter((x) => x.id !== id);
    saveGuests();
    render();
  }

  function render() {
    const root = document.getElementById("mw-app");
    if (!loaded) {
      root.innerHTML = '<div class="mw-loading">Cargando lista...</div>';
      return;
    }
    if (isClientView) {
      renderClientView();
      return;
    }
    renderStaffView();
  }

  // ---------- CLIENT VIEW (goes on the QR code) ----------
  function renderClientView() {
    const root = document.getElementById("mw-app");
    root.innerHTML = `
      <div class="mw-client-wrap">
        <div class="mw-client-card">
          <div class="mw-client-logo">Mirai Franklin</div>
          <div class="mw-client-sub">SUMARME A LA LISTA DE ESPERA</div>
          <form id="mw-client-form">
            <div class="mw-client-field">
              <label>Nombre</label>
              <input type="text" name="name" required autocomplete="off" />
            </div>
            <div class="mw-client-field">
              <label>WhatsApp</label>
              <div class="mw-phone-group">
                <span class="mw-phone-prefix">+56</span>
                <input type="tel" name="phone" placeholder="9 1234 5678" inputmode="numeric" required autocomplete="off" />
              </div>
            </div>
            <div class="mw-client-field">
              <label>N° de personas</label>
              <input type="number" name="party" min="1" value="2" required autocomplete="off" />
            </div>
            <div class="mw-client-field">
              <label>Algo que debamos saber (opcional)</label>
              <textarea name="note" rows="2" placeholder="Cumpleaños, alergia, mensaje especial..."></textarea>
            </div>
            <button type="submit" class="mw-client-submit">Unirme a la fila</button>
          </form>
        </div>
      </div>
      <div class="mw-version-tag">${APP_VERSION}</div>
    `;
    document.getElementById("mw-client-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const f = e.target;
      if (!f.name.value.trim() || !f.phone.value.trim()) return;
      const localDigits = f.phone.value.replace(/\D/g, "");
      const fullPhone = "+56" + localDigits;
      const guest = addGuest(f.name.value, fullPhone, f.party.value, f.note.value);
      const position =
        guests.filter((g) => g.status === "waiting" && g.arrivedAt <= guest.arrivedAt).length;
      renderClientConfirm(position);
    });
  }

  function renderClientConfirm(position) {
    const root = document.getElementById("mw-app");
    root.innerHTML = `
      <div class="mw-client-wrap">
        <div class="mw-client-card mw-confirm">
          <div class="mw-confirm-check">✓</div>
          <div class="mw-confirm-pos">#${position}</div>
          <div class="mw-confirm-pos-label">Tu lugar en la fila</div>
          <div class="mw-confirm-msg">Quedaste anotado. Apenas se libere tu mesa te avisamos por WhatsApp — no necesitas volver a la caja a preguntar.</div>
        </div>
      </div>
    `;
  }

  // ---------- STAFF VIEW (internal use only) ----------
  function renderStaffView() {
    const root = document.getElementById("mw-app");
    const waiting = guests.filter((g) => g.status === "waiting");
    const notified = guests.filter((g) => g.status === "notified");
    const totalWaiting = guests.length;
    const avgWait = guests.length
      ? Math.round(
          guests.reduce((sum, g) => sum + (Date.now() - g.arrivedAt), 0) /
            guests.length /
            60000
        )
      : 0;

    const sorted = [...guests].sort((a, b) => a.arrivedAt - b.arrivedAt);

    root.innerHTML = `
      <div class="mw-header">
        <div>
          <div class="mw-title">Mirai Franklin</div>
          <div class="mw-sub">LISTA DE ESPERA — STAFF</div>
        </div>
      </div>

      <div class="mw-stats">
        <div>
          <div class="mw-stat-num">${totalWaiting}</div>
          <div class="mw-stat-label">En espera</div>
        </div>
        <div>
          <div class="mw-stat-num">${avgWait}</div>
          <div class="mw-stat-label">Min. promedio</div>
        </div>
        <div>
          <div class="mw-stat-num">${notified.length}</div>
          <div class="mw-stat-label">Avisados</div>
        </div>
      </div>

      <form class="mw-form" id="mw-form">
        <input type="text" name="name" placeholder="Nombre" required autocomplete="off" />
        <input type="tel" name="phone" placeholder="Teléfono (+56 9...)" required autocomplete="off" />
        <input type="number" name="party" placeholder="N° personas" min="1" required autocomplete="off" />
        <input type="text" name="note" placeholder="Nota (opcional)" autocomplete="off" />
        <button type="submit" class="mw-add-btn">Agregar a la lista (respaldo manual)</button>
      </form>

      <div class="mw-list">
        ${
          sorted.length === 0
            ? '<div class="mw-empty">No hay nadie esperando ahora mismo.</div>'
            : sorted.map(renderTicket).join("")
        }
      </div>
      <div class="mw-version-tag">${APP_VERSION}</div>
    `;

    document.getElementById("mw-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const f = e.target;
      const name = f.name.value;
      const phone = f.phone.value;
      const party = f.party.value;
      const note = f.note.value;
      if (!name.trim() || !phone.trim()) return;
      addGuest(name, phone, party, note);
      render();
      f.reset();
      f.name.focus();
    });

    sorted.forEach((g) => {
      const notifyBtn = document.getElementById("notify-" + g.id);
      if (notifyBtn) notifyBtn.addEventListener("click", () => markNotified(g.id));
      const seatBtn = document.getElementById("seat-" + g.id);
      if (seatBtn) seatBtn.addEventListener("click", () => markSeated(g.id));
      const removeBtn = document.getElementById("remove-" + g.id);
      if (removeBtn) removeBtn.addEventListener("click", () => removeGuest(g.id));
    });
  }

  function renderTicket(g) {
    const elapsedMs = Date.now() - g.arrivedAt;
    const mins = fmtElapsed(elapsedMs);
    const overdue = g.status === "waiting" && elapsedMs > 20 * 60000;
    const notified = g.status === "notified";
    const classes = ["mw-ticket"];
    if (notified) classes.push("mw-notified");
    if (overdue) classes.push("mw-overdue");

    return `
      <div class="${classes.join(" ")}">
        ${notified ? '<div class="mw-notified-tag">Avisado</div>' : ""}
        <div class="mw-ticket-left">
          <div class="mw-ticket-name">${escapeHtml(g.name)}</div>
          <div class="mw-ticket-meta">
            <span class="mw-badge-party">${escapeHtml(String(g.party))} pers.</span>
            <span>${escapeHtml(g.phone)}</span>
          </div>
          ${g.note ? `<div class="mw-note">💬 ${escapeHtml(g.note)}</div>` : ""}
        </div>
        <div class="mw-ticket-right">
          <div class="mw-wait ${overdue ? "mw-overdue-text" : ""}">
            <div class="mw-wait-num">${mins}</div>
            <div class="mw-wait-label">min</div>
          </div>
          <div class="mw-actions">
            ${
              !notified
                ? `<button class="mw-btn mw-btn-notify" id="notify-${g.id}">Mesa lista</button>`
                : `<button class="mw-btn mw-btn-seat" id="seat-${g.id}">Sentar</button>`
            }
            <button class="mw-btn mw-btn-remove" id="remove-${g.id}" title="Quitar">✕</button>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  loadGuests();
  // Solo la pantalla de staff necesita refrescarse sola (para actualizar los minutos de espera).
  // La pantalla de cliente nunca se refresca sola para no perder lo que está escribiendo.
  setInterval(() => {
    if (!isClientView) render();
  }, 15000);
})();
</script>
